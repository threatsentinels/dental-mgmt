{% if existing_patient %}
<div class="p-4 bg-amber-50 border border-amber-300 rounded-xl flex items-start space-x-3 text-amber-800">
    <div class="text-lg">⚠️</div>
    <div class="flex-1 text-sm">
        <span class="font-bold">Possible Duplicate Patient Detected:</span> A patient registered as 
        <strong class="underline">{{ existing_patient.full_name }}</strong> (Code: {{ existing_patient.patient_code }}) 
        already exists with phone number <strong>{{ existing_patient.phone }}</strong>.
    </div>
    <a href="{% url 'patient_detail' existing_patient.pk %}" class="text-xs bg-amber-200 hover:bg-amber-300 text-amber-900 font-semibold px-2.5 py-1 rounded transition">
        View Existing
    </a>
</div>
{% endif %}
