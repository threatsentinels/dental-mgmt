<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dental Management System{% endblock %}</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
        }
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
        .navbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        .nav-left { display: flex; align-items: center; gap: 20px; }
        .brand { font-weight: 700; font-size: 1.125rem; color: var(--primary); text-decoration: none; }
        .nav-links { display: flex; gap: 16px; }
        .nav-link { color: var(--text); text-decoration: none; font-size: 0.875rem; font-weight: 500; }
        .nav-link:hover { color: var(--primary); }
        .tenant-pill { background: #e0f2fe; color: #0369a1; padding: 4px 10px; border-radius: 9999px; font-size: 0.8125rem; font-weight: 600; }
        .user-nav { display: flex; align-items: center; gap: 16px; font-size: 0.875rem; }
        .btn-link { color: var(--danger); text-decoration: none; font-weight: 600; background: none; border: none; cursor: pointer; font-size: 0.875rem; }
        .main-container { max-width: 1100px; margin: 32px auto; padding: 0 16px; }
        .btn { display: inline-block; padding: 8px 16px; border-radius: 6px; font-size: 0.875rem; font-weight: 600; text-decoration: none; border: none; cursor: pointer; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: #e2e8f0; color: #334155; }
        .form-card { background: var(--surface); padding: 24px; border-radius: 8px; border: 1px solid var(--border); }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 6px; }
        .form-input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.875rem; }
        .table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
        .table th, .table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.875rem; }
        .table th { background: #f1f5f9; font-weight: 600; color: var(--text-muted); }
        .alert-badge { background: var(--danger-bg); color: var(--danger); padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; display: inline-block; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% if user.is_authenticated %}
    <nav class="navbar">
        <div class="nav-left">
            <a href="{% url 'accounts:dashboard' %}" class="brand">Nepal Dental PMS</a>
            {% if request.clinic %}
            <span class="tenant-pill">{{ request.clinic.name }}</span>
            {% endif %}
            <div class="nav-links">
                <a href="{% url 'accounts:dashboard' %}" class="nav-link">Dashboard</a>
                <a href="{% url 'patients:patient_list' %}" class="nav-link">Patients</a>
            </div>
        </div>
        <div class="user-nav">
            <span><strong>{{ user }}</strong></span>
            <form method="post" action="{% url 'accounts:logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="btn-link">Logout</button>
            </form>
        </div>
    </nav>
    {% endif %}

    <main class="main-container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
