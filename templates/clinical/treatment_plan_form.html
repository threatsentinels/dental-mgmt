{% extends "base.html" %}

{% block title %}Create Treatment Plan — Dental PMS{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto; background: white; padding: 24px; border-radius: 8px; border: 1px solid var(--border);">
    <h2 style="margin-top: 0;">New Dental Treatment Plan</h2>
    <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 24px;">Proposed procedures and financial estimates in NPR.</p>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Plan Title *</label>
            {{ form.title }}
        </div>
        <div class="form-group">
            <label>Status</label>
            {{ form.status }}
        </div>
        <div class="form-group">
            <label>Plan Notes / Instructions</label>
            {{ form.notes }}
        </div>
        <div style="display: flex; gap: 12px; margin-top: 24px;">
            <button type="submit" class="btn-primary">Create Plan & Add Procedures</button>
            <a href="{% url 'patients:detail' view.kwargs.patient_id %}" style="padding: 10px 16px; border: 1px solid var(--border); border-radius: 6px; text-decoration: none; color: var(--text); font-weight: 600;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
